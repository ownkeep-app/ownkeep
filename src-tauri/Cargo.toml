[package]
name = "keystash"
version = "1.0.0"
description = "Offline-first macOS vault and command launcher"
authors = ["Shaojiang"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "keystash_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
tauri-plugin-notification = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"

# Cryptography (Phase 1 vault core): Argon2id + HKDF + XChaCha20-Poly1305 envelope encryption.
argon2 = "0.5"
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
zeroize = { version = "1", features = ["derive"] }
getrandom = "0.2"
base64 = "0.22"
bip39 = "2"

# Desktop-only plugins (keystash targets macOS; these are not built for mobile).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", features = ["NSPasteboard"] }
objc2-foundation = { version = "0.3.2", features = ["NSString"] }
# Touch ID biometric unlock (spec §4.7): a biometric-gated Keychain item (security-framework) +
# an LAContext availability probe (objc2-local-authentication). macOS-only; the enable/disable/
# unlock/status logic is unit-tested via a trait fake, the native path is validated manually.
objc2-local-authentication = { version = "0.3", features = ["LAContext", "LAError"] }
security-framework = "3"
# Modern UserNotifications path — NSUserNotificationCenter (tauri-plugin-notification default)
# is unreliable on recent macOS (Sequoia/Tahoe).
notify-rust = { version = "4.18", default-features = false, features = ["preview-macos-un"] }

[dev-dependencies]
proptest = "1"
